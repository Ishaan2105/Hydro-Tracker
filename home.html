<!DOCTYPE html>
<html lang="en">
<head> 

    <link rel="icon" type="image/png" href="icon-192x192.png">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512x512.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1565c0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hydro Tracker">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HydroTracker | Home</title>
    <link rel="stylesheet" href="home.css">
</head>
<body class="theme-day">
    <div id="toast-container"></div>
    <!-- DESKTOP/LANDSCAPE SIDEBAR -->
    <nav class="sidebar">
        <div class="sidebar-brand">
            <span class="sidebar-brand-icon">💧</span>
            <span class="sidebar-brand-text">HydroTracker</span>
        </div>
        <div class="nav-links">
            <a href="home.html" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </a>
            <a href="history.html" class="nav-item">
                <span class="nav-icon">📅</span>
                <span class="nav-label">History</span>
            </a>
            <a href="insights.html" class="nav-item">
                <span class="nav-icon">💡</span>
                <span class="nav-label">Insights</span>
            </a>
            <a href="leaderboard.html" class="nav-item">
                <span class="nav-icon">🏆</span>
                <span class="nav-label">Leaderboard</span>
            </a>
            <a href="settings.html" class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Settings</span>
            </a>
            <button id="pwa-install-btn" class="nav-item install-app-btn" style="display:none;" onclick="triggerPWAInstall()">
                <span class="nav-icon">📲</span>
                <span class="nav-label">Install App</span>
            </button>
        </div>
        <div class="user-profile" onclick="toggleLogout()">
            <div class="user-avatar" id="user-initial">U</div>
            <div class="user-info">
                <span id="username-display">Username</span>
            </div>
            <div id="logout-menu" class="logout-dropdown">
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
                <button class="delete-btn" onclick="openDeleteAccountModal()">🗑️ Delete Account</button>
            </div>
        </div>
    </nav>

    <!-- MOBILE TOP HEADER BAR (Portrait / Small screens only) -->
    <header class="mobile-topbar">
        <div class="mobile-brand">
            <span class="sidebar-brand-icon">💧</span>
            <span class="sidebar-brand-text">HydroTracker</span>
        </div>
        <div class="mobile-user-btn" onclick="toggleMobileLogout()">
            <div class="user-avatar" id="mobile-user-initial">U</div>
            <div id="mobile-logout-menu" class="logout-dropdown" style="display:none;">
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
                <button class="delete-btn" onclick="openDeleteAccountModal()">🗑️ Delete Account</button>
            </div>
        </div>
    </header>

    <!-- MOBILE BOTTOM NAVIGATION TAB BAR (Portrait / Small screens only) -->
    <nav class="mobile-bottom-nav">
        <a href="home.html" class="mob-nav-item active">
            <span class="mob-nav-icon">🏠</span>
            <span class="mob-nav-label">Home</span>
        </a>
        <a href="history.html" class="mob-nav-item">
            <span class="mob-nav-icon">📅</span>
            <span class="mob-nav-label">History</span>
        </a>
        <a href="insights.html" class="mob-nav-item">
            <span class="mob-nav-icon">💡</span>
            <span class="mob-nav-label">Insights</span>
        </a>
        <a href="leaderboard.html" class="mob-nav-item">
            <span class="mob-nav-icon">🏆</span>
            <span class="mob-nav-label">Leaderboard</span>
        </a>
        <button id="mobile-pwa-install-btn" class="mob-nav-item install-app-btn" style="display:none;" onclick="triggerPWAInstall()">
            <span class="mob-nav-icon">📲</span>
            <span class="mob-nav-label">Install</span>
        </button>
        <a href="settings.html" class="mob-nav-item">
            <span class="mob-nav-icon">⚙️</span>
            <span class="mob-nav-label">Settings</span>
        </a>
    </nav>

    <main class="content">
        <section class="hero-section">
            <div class="progress-container">
                <div class="circular-progress">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" class="bg-ring"></circle>
                        <circle cx="50" cy="50" r="45" class="progress-ring" id="progress-bar"></circle>
                    </svg>
                    <div class="progress-text">
                        <h2 id="percent-text">0%</h2>
                        <p id="liters-text">0 / 2.5 L</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ⚠️ Streak Risk Warning Banner -->
        <div id="streak-risk-banner" style="display:none;"
            class="streak-risk-banner">
            <span id="streak-risk-icon">⚠️</span>
            <span id="streak-risk-msg">At this pace you might miss your goal today.</span>
            <button onclick="document.getElementById('streak-risk-banner').style.display='none'" class="risk-dismiss">×</button>
        </div>

        <section class="quick-log">
            <h3>Quick Log ⏱️</h3>
            <div class="log-grid">
                <button onclick="logWater(250)">250ml 🥛</button>
                <button onclick="logWater(500)">500ml 🥤</button>
                <button onclick="logWater(750)">750ml 🍶</button>
                <button onclick="logWater(1000)">1L 💧</button>
                <div class="custom-row">
                    <input type="number" id="custom-val" placeholder="Custom ml">
                    <button onclick="logCustom()">Add ➕</button>
                </div>
                <button class="undo-btn" onclick="undoLog()">Undo Last ↩️</button>
            </div>
        </section>

        <section class="mini-stats">
            <div class="stat-card">🔥 Streak: <span id="streak">0</span></div>
            <div class="stat-card">🏆 Best: <span id="best">0</span></div>
        </section>
    </main>

    <!-- 🤖 Hydration Coach Floating Button -->
    <div id="coach-bubble" onclick="toggleCoach()" title="Hydration Coach">
        <span id="coach-bubble-icon">🤖</span>
        <span id="coach-bubble-notif" class="coach-notif-dot" style="display:none;"></span>
    </div>

    <!-- Coach Chat Panel -->
    <div id="coach-panel" class="coach-panel" style="display:none;">
        <div class="coach-header">
            <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:1.4rem;">🤖</span>
                <div>
                    <div style="font-weight:800;font-size:0.95rem;">Hydration Coach</div>
                    <div style="font-size:0.72rem;opacity:0.7;">Powered by your data</div>
                </div>
            </div>
            <button onclick="toggleCoach()" class="coach-close">×</button>
        </div>
        <div class="coach-messages" id="coach-messages"></div>
        <div class="coach-chips" id="coach-chips"></div>
        <div class="coach-input-row">
            <input type="text" id="coach-input" placeholder="Ask me anything..." onkeydown="if(event.key==='Enter')sendCoachMessage()">
            <button onclick="sendCoachMessage()" class="coach-send">➤</button>
        </div>
    </div>

<!-- EFFECTS -->
    <div id="waves-bg"></div>

    <script src="home.js"></script>
</body>
</html>
